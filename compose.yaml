services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_ACCESS_TOKEN: ${RELAY_ACCESS_TOKEN:?Set RELAY_ACCESS_TOKEN in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      RELAY_MODEL: ${RELAY_MODEL:-cohere/north-mini-code:free}
      RELAY_OLLAMA_URL: ${RELAY_OLLAMA_URL:-}
      RELAY_OLLAMA_MODELS: ${RELAY_OLLAMA_MODELS:-}
      RELAY_MAX_ACTIVE: ${RELAY_MAX_ACTIVE:-1}
      RELAY_DATA_DIR: /data
      ATLAS_MCP_URL: ${ATLAS_MCP_URL:-}
      ATLAS_MCP_TOKEN: ${ATLAS_MCP_TOKEN:-}
      ATLAS_WEB_ORIGIN: ${ATLAS_WEB_ORIGIN:-}
      RELAY_ATLAS_DEV_TASKS: ${RELAY_ATLAS_DEV_TASKS:-}
      RELAY_GITHUB_TOKEN: ${RELAY_GITHUB_TOKEN:-}
      RELAY_PI_NATIVE_MCP: ${RELAY_PI_NATIVE_MCP:-0}
      RELAY_PI_SUBAGENTS: ${RELAY_PI_SUBAGENTS:-0}
      RELAY_GITHUB_WRITE_REPOS: ${RELAY_GITHUB_WRITE_REPOS:-}
      RELAY_MCP_PROVIDERS: ${RELAY_MCP_PROVIDERS:-[]}
      RELAY_MCP_HOST_ALLOWLIST: ${RELAY_MCP_HOST_ALLOWLIST:-}
      RELAY_SESSION_BUDGET_USD: ${RELAY_SESSION_BUDGET_USD:-0}
      RELAY_GLOBAL_BUDGET_USD: ${RELAY_GLOBAL_BUDGET_USD:-0}
      RELAY_SESSION_TOKEN_LIMIT: ${RELAY_SESSION_TOKEN_LIMIT:-0}
      RELAY_RUN_RESERVATION_USD: ${RELAY_RUN_RESERVATION_USD:-0}
      PORT: "8765"
      HOST: "0.0.0.0"
    volumes:
      - relay_data:/data
    ports:
      - "127.0.0.1:8765:8765"
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s

volumes:
  relay_data:
