services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8765"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8765:8765"
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
