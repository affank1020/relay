name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript typecheck
        run: npm run check
      - name: Build production TypeScript bundles
        run: npm run build
      - name: Test compiled browser and real Pi server
        run: npm test
      - name: Install headless Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Test actual browser task console scrolling
        run: node --import tsx --test --test-timeout=65000 tests/task-console-browser.browser.ts
      - name: Test real browser reviewed Git Skill management
        run: node --import tsx --test --test-timeout=65000 tests/reviewed-skills-browser.browser.ts
      - name: Test real browser GitHub write approval
        run: node --import tsx --test --test-timeout=65000 tests/github-writes-browser.browser.ts
      - name: Reject checked-in JavaScript source
        run: |
          test -z "$(find src tests public -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.jsx' \) -print)"
          test -f dist/server.js
          test -f dist/healthcheck.js
          test -f dist/atlas-smoke.js
          test -f dist/public/app.js
          ! git ls-files | grep -E '^(src|tests|public)/.*\.(js|mjs|cjs|jsx)$'
      - name: Check deployment scripts and Compose
        env:
          RELAY_ACCESS_TOKEN: ci-only-test-placeholder-token-123456
          OPENROUTER_API_KEY: ci-only-placeholder
        run: |
          bash -n scripts/*.sh
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.ingress.yaml config --quiet
          # Verify Compose forwards the configured Atlas origin into the container.
          ATLAS_WEB_ORIGIN=https://atlas.example.com docker compose -f compose.yaml config --format json |
            node -e "let value='';process.stdin.on('data',part=>value+=part);process.stdin.on('end',()=>{const data=JSON.parse(value);if(data.services?.relay?.environment?.ATLAS_WEB_ORIGIN!=='https://atlas.example.com')process.exit(1);})"
      - name: Validate internal Caddy gateway
        env:
          RELAY_ACCESS_TOKEN: ci-only-test-placeholder-token-123456
        run: |
          docker run --rm -e RELAY_ACCESS_TOKEN \
            -v "$PWD/infra/Caddyfile.relay:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Verify gateway image contains local HTTP probe
        run: docker run --rm caddy:2-alpine sh -c 'command -v wget'
      - name: Build production container
        run: docker build -t relay:ci .
      - name: Verify Atlas smoke command runs from production image without tsx
        run: |
          set -euo pipefail
          # Missing credentials must yield the expected diagnostic, not a missing
          # TypeScript entrypoint/module. No external Atlas access is attempted.
          set +e
          output="$(docker run --rm --entrypoint npm relay:ci run atlas:smoke 2>&1)"
          exit_code=$?
          set -e
          test "$exit_code" -eq 1
          printf '%s\n' "$output" | grep -Fq 'Atlas smoke requires ATLAS_MCP_URL and a 64-hex ATLAS_MCP_TOKEN.'
