# Atlas's HTTPS Caddy ingress proxies into this private gateway.
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RELAY_ACCESS_TOKEN: ${RELAY_ACCESS_TOKEN:?Set RELAY_ACCESS_TOKEN in .env}
    volumes:
      - ./infra/Caddyfile.relay:/etc/caddy/Caddyfile:ro
    depends_on:
      relay:
        condition: service_healthy
    networks:
      default: {}
      vps_ingress:
        aliases: [relay-gateway]
    security_opt:
      - no-new-privileges:true

networks:
  vps_ingress:
    external: true
    name: vps_ingress
